[project]
name = "finance-os"
version = "1.0.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "venv",
    ".venv",
    "ENV",
    "env",
    "data",
    "logs",
    "__pycache__",
    ".opencode",
    "packages",
    "services/api",
    "Default Project",
    "alembic/versions",
    "scripts",
    "services/email_service.py",
]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "alembic/versions/"
