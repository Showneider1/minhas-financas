services:
  app:
    build: .
    image: finance-os:latest
    container_name: finance-os-app
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    # Somente serviços da rede interna do Compose podem acessar a app.
    expose:
      - "8050"
    volumes:
      # SQLite persistente fora do contêiner.
      # Se o contêiner for recriado, o banco continua aqui.
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8050/')"
      ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:latest
    container_name: finance-os-caddy
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

  # Postgres opcional para staging/local.
  # Não sobe por padrão; use: docker compose --profile postgres up -d
  postgres:
    profiles:
      - postgres
    image: postgres:15-alpine
    container_name: finance-os-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-finance_os}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
