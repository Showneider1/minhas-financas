[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q

# Filtros temporários para warnings sistêmicos de dependências externas.
# Não remove validações internas; apenas reduz ruído enquanto migra o stack.
filterwarnings =
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning:sqlalchemy.sql.schema
    ignore::DeprecationWarning:sqlalchemy.sql.schema
